name: Unit Tests

# Documentation-only changes skip CI.
#
# `paths-ignore` skips the run only when *every* changed file matches one of
# the patterns below — a commit touching both a doc and a source file still
# runs the full suite.
#
# `*.md` and `reference/*.md` use a single `*`, which does not match `/`, so
# they cover only top-level markdown. That keeps
# `reference/server/constants/prompts/*.md` OUT of the ignore list: those are
# runtime agent templates whose rendered text is asserted by the test suite,
# so editing one must still trigger CI. The same goes for `.claude/commands/`,
# which the app serves as built-in slash commands.
#
# The list is duplicated across the two triggers on purpose; keep the copies
# in sync by hand.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'                             # README.md, SPEC.md, CONTRIBUTING.md
      - 'LICENSE'
      - 'core/**'                          # spec prose
      - 'extra/**'                         # spec prose
      - 'reference/*.md'                   # CLAUDE.md, AGENTS.md
      - 'reference/CLAUDE.local.md.example'
      - 'reference/docs/**'
      - 'reference/**/README.md'
  push:
    branches: [main]
    paths-ignore:
      - '*.md'                             # README.md, SPEC.md, CONTRIBUTING.md
      - 'LICENSE'
      - 'core/**'                          # spec prose
      - 'extra/**'                         # spec prose
      - 'reference/*.md'                   # CLAUDE.md, AGENTS.md
      - 'reference/CLAUDE.local.md.example'
      - 'reference/docs/**'
      - 'reference/**/README.md'

jobs:
  test:
    runs-on: ubuntu-latest

    # The app lives in reference/ (the repo root holds SPEC.md + workflows).
    # Run all pnpm steps from there.
    defaults:
      run:
        working-directory: reference

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v4.4.0
        with:
          package_json_file: reference/package.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: reference/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:run
